<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نتیجه پرداخت — رستوران زعفران</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face { font-family: "Vazirmatn"; src: url("/assets/fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Vazirmatn"; src: url("/assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Vazirmatn", Tahoma, sans-serif; background: #0f1420; color: #eef1f7;
         display: grid; place-items: center; height: 100vh; }
  .card { background: #171e2e; border: 1px solid #2a3550; border-radius: 20px; padding: 48px 56px;
          text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5); max-width: 460px; }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin-bottom: 10px; color: #f4b942; }
  p  { color: #9aa7c0; font-size: 15px; line-height: 1.9; }
  .ok  h1 { color: #4ade80; }
  .fail h1 { color: #f87171; }
  a.btn { display: inline-block; margin-top: 26px; padding: 12px 32px; border-radius: 12px;
          background: linear-gradient(135deg, #f4b942, #e08d1f); color: #1a1205; font-weight: 700;
          text-decoration: none; }
  .meta { margin-top: 14px; font-size: 12px; color: #5b6b8c; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">در حال بررسی پرداخت…</h1>
    <p id="msg">در حال ارتباط با درگاه پرداخت بانکی.</p>
    <a class="btn" href="/">بازگشت به رستوران</a>
    <p class="meta">رستوران زعفران • پرداخت آنلاین امن</p>
  </div>
  <script>
    const ok = new URLSearchParams(location.search).get("status") === "ok";
    document.getElementById("card").className = "card " + (ok ? "ok" : "fail");
    document.getElementById("icon").textContent = ok ? "✅" : "❌";
    document.getElementById("title").textContent = ok ? "پرداخت با موفقیت انجام شد!" : "پرداخت ناموفق بود";
    document.getElementById("msg").textContent = ok
      ? "سفارش شما تأیید و به آشپزخانه ارسال شد. نوش جان!"
      : "درگاه بانکی تراکنش را رد کرد. مبلغی از حساب شما کسر نشده است — لطفاً دوباره تلاش کنید.";
  </script>
</body>
</html>
